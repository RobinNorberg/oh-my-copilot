name: CI

on:
  push:
    branches: [main, dev]
    tags:
      - "v*"
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      smoke_scenarios:
        description: 'Opt-in tier 2 Copilot smoke scenarios, comma-separated (e.g. continuation,prompt-context,events: ~1.4 AI credits). Empty: none.'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/deps
        with:
          node-version: '20'

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

  test:
    name: Test
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/deps
        with:
          node-version: '20'

      - name: Run functional tests
        run: npm test -- --run

      - name: Run subagent-lock performance test
        run: npm exec vitest -- run tests/perf/subagent-lock.bench.ts --fileParallelism=false --maxWorkers=1

  test-windows:
    name: Test (Windows path suite)
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/deps
        with:
          # better-sqlite3 12.10+ no longer ships a Node 20 Windows prebuild.
          # Pin the runner with the supported VS 2022 toolchain so Node 20 users
          # keep a tested source-build path instead of hiding the gap with Node 22.
          node-version: '20'

      # Scoped to the cross-platform path/encoding suites on a real Windows
      # runner. The ubuntu-only `test` job exercises POSIX separators, so
      # forward-slash assumptions in project-dir encoding and worktree
      # transcript resolution (see #3274, #3276) can slip through it. Running
      # the full `npm test` suite here is not yet possible: it has pre-existing
      # platform-specific failures on Windows (e.g. python-repl sandbox, lsp
      # devcontainer, session-end path interpolation) that are out of scope for
      # this gate. Keep this list in sync with the path-handling test files.
      # run.cjs supervisor/stdio contract tests (#3920) must run here: leaked
      # protocol handles and process-tree reap are Windows-hosted failures.
      - name: Run Windows path-handling tests
        run: >-
          npx vitest run --fileParallelism=false
          src/utils/__tests__/encode-project-path.test.ts
          src/__tests__/resolve-transcript-path.test.ts
          src/__tests__/session-history-search.test.ts
          src/cli/__tests__/session-search.test.ts
          src/lib/__tests__/worktree-paths.test.ts
          src/lib/__tests__/worktree-paths-git-probe-failclosed.test.ts
          src/lib/__tests__/worktree-paths-foreign-root.test.ts
          src/lib/__tests__/worktree-paths-issue-4254-win32.test.ts
          src/lib/__tests__/worktree-paths-nested-under-gitless-root.test.ts
          src/tools/__tests__/wiki-tools-git-probe-failclosed.test.ts
          src/tools/__tests__/wiki-tools-direct-dist-failclosed.test.ts
          src/hooks/project-memory/__tests__/hot-path-tracker.test.ts
          src/__tests__/windows-prompt-hook-runner.test.ts
          src/__tests__/run-cjs-generic-timeout.test.ts
          src/__tests__/run-cjs-windows-stdio-contract.test.ts
          src/installer/__tests__/claude-md-transaction.test.ts
          src/team/__tests__/cli-detection.windows.integration.test.ts

  # Unrolled matrix: each job's literal `name:` is the check name `omg ship`
  # requires, so a job skipped by a job-level `if:` still reports under it.
  better-sqlite3-node26-ubuntu:
    name: better-sqlite3 Node 26 (ubuntu-latest)
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/deps
        with:
          node-version: '26'

      - name: Smoke-test native SQLite on Node 26
        run: node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); db.prepare('select 1 as ok').get(); db.close();"

  better-sqlite3-node26-windows:
    name: better-sqlite3 Node 26 (windows-2022)
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/deps
        with:
          node-version: '26'

      - name: Smoke-test native SQLite on Node 26
        run: node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); db.prepare('select 1 as ok').get(); db.close();"

  # PreCompact restore runs the shipped dist/ from the Build job's
  # build-output (JS output is platform-independent); build:contained-fs
  # still builds the darwin addon natively and skips on other platforms.
  test-precompact-restore-ubuntu:
    name: PreCompact restore (ubuntu-latest)
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/deps
        with:
          node-version: '20'

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output

      - name: Unpack shipped restore implementation
        shell: bash
        run: |
          tar -xf "$RUNNER_TEMP/build-output/build-output.tar"
          jq -r '.files[]|"\(.sha256)  \(.path)"' "$RUNNER_TEMP/build-output/build-manifest.json" | sha256sum -c --quiet
          npm run build:contained-fs

      - name: Run portable restore and SessionStart interleaving tests
        env:
          OMC_PRECOMPACT_DIST_INTERLEAVINGS: '1'
        run: >-
          npx vitest run
          src/hooks/__tests__/precompact-restore.test.ts
          src/__tests__/session-start-precompact-restore.test.ts

  test-precompact-restore-macos:
    name: PreCompact restore (macos-latest)
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: macos-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/deps
        with:
          node-version: '20'

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output

      - name: Unpack shipped restore implementation
        shell: bash
        run: |
          tar -xf "$RUNNER_TEMP/build-output/build-output.tar"
          # A cache hit skips npm ci, so node-gyp never fetched headers; use the
          # headers that ship with the setup-node toolcache install instead.
          npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")" npm run build:contained-fs

      - name: Run portable restore and SessionStart interleaving tests
        env:
          OMC_PRECOMPACT_DIST_INTERLEAVINGS: '1'
        run: >-
          npx vitest run
          src/hooks/__tests__/precompact-restore.test.ts
          src/__tests__/session-start-precompact-restore.test.ts

  test-precompact-restore-windows:
    name: PreCompact restore (windows-2022)
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: windows-2022
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/deps
        with:
          node-version: '20'

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output

      - name: Unpack shipped restore implementation
        shell: bash
        run: |
          # Git Bash GNU tar reads a drive-letter path as host:path without --force-local.
          tar --force-local -xf "$RUNNER_TEMP/build-output/build-output.tar"
          jq -r '.files[]|"\(.sha256)  \(.path)"' "$RUNNER_TEMP/build-output/build-manifest.json" | sha256sum -c --quiet
          npm run build:contained-fs

      - name: Run portable restore and SessionStart interleaving tests
        env:
          OMC_PRECOMPACT_DIST_INTERLEAVINGS: '1'
        run: >-
          npx vitest run
          src/hooks/__tests__/precompact-restore.test.ts
          src/__tests__/session-start-precompact-restore.test.ts

  # The build-once producer: no `needs`, so it runs beside Lint and Test.
  # build-output carries every path `npm run build` writes (tar keeps file
  # modes), the `npm pack --ignore-scripts` tarball and a sha256 manifest.
  build:
    name: Build
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/deps
        with:
          node-version: '20'

      - name: Verify committed plugin shipping surface
        run: npm run plugin:shipping:verify

      - name: Build
        run: |
          npm run build
          # The committed tree is expected to be build-clean; a diff means stale committed output.
          git diff --exit-code

      - name: Verify bridge omits retired merge-readiness tools
        run: |
          set -e
          for tool in merge_readiness_start merge_readiness_set_content merge_readiness_record_answer merge_readiness_report merge_readiness_cancel; do
            if grep -q "\"$tool\"" bridge/mcp-server.cjs; then
              echo "::error::Retired merge-readiness tool remains registered in bridge/mcp-server.cjs: $tool"
              exit 1
            fi
            echo "bridge omits retired tool $tool"
          done

      - name: Check dist size
        run: |
          DIST_SIZE=$(du -sm dist | cut -f1)
          echo "📦 Dist size: ${DIST_SIZE}MB"
          if [ "$DIST_SIZE" -gt 50 ]; then
            echo "⚠️ Warning: dist folder is larger than 50MB!"
          fi

      - name: Package build output
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/build-output"
          mkdir -p "$OUT"
          # Every path `npm run build` writes; native/ holds the addon on darwin only.
          tar -cf "$OUT/build-output.tar" dist bridge copilot/hooks.json copilot/agents docs/shared .omg/projection-manifest.json CLAUDE.md .github/CLAUDE.md native
          TARBALL=$(npm pack --ignore-scripts --pack-destination "$OUT" --silent | tail -1)
          test -s "$OUT/$TARBALL"
          TREE=$(git rev-parse 'HEAD^{tree}')
          TARBALL_SHA256=$(sha256sum "$OUT/$TARBALL" | cut -d ' ' -f 1)
          tar -tf "$OUT/build-output.tar" | grep -v '/$' | sort | tr '\n' '\0' | xargs -0 sha256sum \
            | jq -R 'capture("^(?<sha256>[0-9a-f]+)  (?<path>.+)$")' \
            | jq -s --arg tree "$TREE" --arg node "$(node --version)" --arg tarball "$TARBALL" --arg tarballSha256 "$TARBALL_SHA256" \
                '{tree: $tree, node: $node, tarball: $tarball, tarballSha256: $tarballSha256, files: .}' > "$OUT/build-manifest.json"
          jq '{tree, node, tarball, tarballSha256, files: (.files | length)}' "$OUT/build-manifest.json"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output/
          if-no-files-found: error
          retention-days: 3

  no-committed-build-artifacts:
    name: No Committed Build Artifacts
    runs-on: ubuntu-latest
    # This candidate-side classifier is credential-free containment only; it
    # never authorizes generated artifacts or supplies merge approval.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Hold candidate generated changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/check-no-committed-build-artifacts.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

  multirepo-paths-gate-ubuntu:
    name: Multi-repo Path Gate (AST-grep) (ubuntu-latest)
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/deps
        with:
          node-version: '20'

      - name: Check for raw .omc path constructions
        run: node scripts/ci/check-multirepo-paths.mjs

  multirepo-paths-gate-windows:
    name: Multi-repo Path Gate (AST-grep) (windows-2022)
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/deps
        with:
          node-version: '20'

      - name: Check for raw .omc path constructions
        run: node scripts/ci/check-multirepo-paths.mjs

  version-check:
    name: Version Consistency Check
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check version consistency
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PLUGIN_VERSION=$(node -p "require('./.claude-plugin/plugin.json').version")
          MARKET_VERSION=$(node -p "require('./.claude-plugin/marketplace.json').version")
          ROOT_PLUGIN_VERSION=$(node -p "require('./plugin.json').version")
          ROOT_PLUGIN_NAME=$(node -p "require('./plugin.json').name")

          echo "package.json:              $PKG_VERSION"
          echo ".claude-plugin/plugin.json: $PLUGIN_VERSION"
          echo ".claude-plugin/marketplace.json: $MARKET_VERSION"
          echo "plugin.json (Copilot CLI): $ROOT_PLUGIN_VERSION ($ROOT_PLUGIN_NAME)"

          if [ "$PKG_VERSION" != "$PLUGIN_VERSION" ] || [ "$PKG_VERSION" != "$MARKET_VERSION" ] || [ "$PKG_VERSION" != "$ROOT_PLUGIN_VERSION" ]; then
            echo ""
            echo "❌ Version mismatch!"
            echo "  package.json: $PKG_VERSION"
            echo "  .claude-plugin/plugin.json:  $PLUGIN_VERSION"
            echo "  marketplace.json: $MARKET_VERSION"
            echo "  plugin.json (root): $ROOT_PLUGIN_VERSION"
            echo ""
            echo "All four files must have the same version."
            exit 1
          fi
          if [ "$ROOT_PLUGIN_NAME" != "oh-my-copilot" ]; then
            echo "❌ Root plugin.json name must be oh-my-copilot (got $ROOT_PLUGIN_NAME)"
            exit 1
          fi
          
          echo "✅ All versions match: $PKG_VERSION"

  npm-pack-test:
    name: npm pack + install test
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The Build job's output replaces `npm ci` + `npm run build` here; pack
      # skips `prepack` (a rebuild) because the built tree is already in place.
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output

      - name: Unpack build output
        shell: bash
        run: |
          tar -xf "$RUNNER_TEMP/build-output/build-output.tar"
          jq -r '.files[]|"\(.sha256)  \(.path)"' "$RUNNER_TEMP/build-output/build-manifest.json" | sha256sum -c --quiet

      - name: npm pack test
        run: |
          echo "📦 Creating tarball..."
          npm pack --ignore-scripts

          TARBALL=$(ls -t oh-my-copilot-*.tgz | head -1)
          echo "📦 Tarball: $TARBALL"

          echo "🔎 Verifying the packaged MCP bridge omits retired merge-readiness tools..."
          PACKAGED_MCP_SERVER="$RUNNER_TEMP/packaged-mcp-server.cjs"
          tar -xzOf "$TARBALL" package/bridge/mcp-server.cjs > "$PACKAGED_MCP_SERVER"
          for tool in merge_readiness_start merge_readiness_set_content merge_readiness_record_answer merge_readiness_report merge_readiness_cancel; do
            if grep -q "\"$tool\"" "$PACKAGED_MCP_SERVER"; then
              echo "::error::Retired merge-readiness tool remains registered in npm package: $tool"
              exit 1
            fi
            echo "npm package omits retired tool $tool"
          done

          echo "🔎 Verifying contained-fs in packaged tarball (issue #4217)..."
          for script in scripts/build-contained-fs.mjs scripts/postinstall-contained-fs.mjs scripts/verify-graph-contained-fs.mjs; do
            if ! tar -tzf "$TARBALL" | grep -q "package/$script"; then
              echo "::error::npm package missing required script: $script"
              exit 1
            fi
            echo "✓ $script included in tarball"
          done
          if ! tar -tzf "$TARBALL" | grep -q "package/native/contained-fs.c"; then
            echo "::error::npm package missing native source: native/contained-fs.c"
            exit 1
          fi
          echo "✓ native source included in tarball"
          PKG_JSON=$(tar -xzOf "$TARBALL" package/package.json)
          if ! echo "$PKG_JSON" | grep -q '"postinstall".*postinstall-contained-fs.mjs'; then
            echo "::error::npm package missing postinstall hook"
            exit 1
          fi
          echo "✓ postinstall hook configured"

          # The postinstall hook must never break installing the published tarball.
          # (The addon itself is darwin-only; its build is exercised by the macOS harness.)
          echo "🔎 Installing packed tarball to verify postinstall does not fail..."
          TEST_PREFIX=$(mktemp -d)
          npm install --prefix "$TEST_PREFIX" "./$TARBALL" --no-audit --no-fund
          test -f "$TEST_PREFIX/node_modules/oh-my-copilot/scripts/postinstall-contained-fs.mjs"
          rm -rf "$TEST_PREFIX"
          echo "✓ packed tarball installs cleanly with postinstall hook"

          # ENOTEMPTY hardening (mirrors the upgrade-test job below):
          # the global node_modules dir is reused across runs on GitHub-hosted
          # runners and inside the GitHub-hosted tool cache. A previously
          # interrupted `npm install -g` can leave the resolved package dir
          # and/or npm's staging temp dirs (`.oh-my-copilot-*`) behind,
          # so the next install fails with
          #   npm ERR! ENOTEMPTY: directory not empty, rename
          #     '.../oh-my-copilot' -> '.../.oh-my-copilot-XXXX'
          # Remove any stale global package + npm staging dirs before
          # installing, then retry a few times so a transient rename race does
          # not fail the run. A persistent install failure still exits non-zero.
          PKG=oh-my-copilot
          GLOBAL_ROOT="$(npm root -g)"

          clean_stale_global_pkg() {
            # `:?` guards against an empty GLOBAL_ROOT so we never rm -rf "/".
            rm -rf "${GLOBAL_ROOT:?}/$PKG" 2>/dev/null || true
            find "$GLOBAL_ROOT" -maxdepth 1 -name ".$PKG-*" -exec rm -rf {} + 2>/dev/null || true
          }

          echo "📦 Testing global install from tarball..."
          clean_stale_global_pkg

          ATTEMPTS=3
          INSTALLED=false
          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "Installing $TARBALL globally (attempt $attempt/$ATTEMPTS)"
            if npm install -g "./$TARBALL" --no-audit --no-fund; then
              INSTALLED=true
              break
            fi
            echo "Install attempt $attempt failed; cleaning stale global state and retrying."
            clean_stale_global_pkg
            sleep 2
          done

          if [ "$INSTALLED" != "true" ]; then
            echo "❌ npm install -g ./$TARBALL failed after $ATTEMPTS attempts"
            exit 1
          fi

          echo "🔍 Checking omg command..."
          which omg

          echo "🔍 Testing omg --version..."
          omg --version

          VERSION_OUTPUT=$(omg --version 2>&1)
          if [ $? -ne 0 ]; then
            echo "❌ omg --version failed!"
            echo "$VERSION_OUTPUT"
            exit 1
          fi

          echo "✅ omg --version: $VERSION_OUTPUT"

          echo "🔍 Testing omg --help..."
          omg --help

          HELP_OUTPUT=$(omg --help 2>&1)
          if [ $? -ne 0 ]; then
            echo "❌ omg --help failed!"
            echo "$HELP_OUTPUT"
            exit 1
          fi
          
          echo "✅ npm pack + install test passed!"

  # Headless smoke against the real Copilot CLI on Linux (docs/DEVELOPERS.md
  # "Tier 2 in CI"). Every run: tier 2 SDK static checks, zero model calls.
  # v* tags add the default scenarios (smoke, guardrail: ~0.6 AI credits).
  # Opt-in scenarios (billed, never by default) come from the manual run's
  # `smoke_scenarios` input, or on v* tags from the repository variable
  # COPILOT_SMOKE_OPT_IN (same comma-separated list; a tag push takes no inputs).
  # Needs the COPILOT_GITHUB_TOKEN secret; without it (fork PRs, Dependabot,
  # secret not configured) the job passes with a skip notice. Tags skip the
  # build job, so the condition admits a skipped build on tags only. The
  # release job does not depend on this job.
  smoke:
    name: Copilot smoke (tier 2)
    needs: [build]
    if: ${{ !cancelled() && (needs.build.result == 'success' || (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # `npm i -g @github/copilot` is the CLI's documented npm install; its
      # loader runs the native @github/copilot-linux-x64 binary.
      SMOKE_CLI_DIST_TAG: latest
      SMOKE_SDK_RANGE: '^1.0.16'
      SMOKE_OPT_IN: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_scenarios || (github.event_name == 'push' && github.ref_type == 'tag' && vars.COPILOT_SMOKE_OPT_IN) || '' }}
    steps:
      - name: Check for the Copilot token
        id: gate
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -n "$COPILOT_GITHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Copilot smoke skipped::secret COPILOT_GITHUB_TOKEN is not available to this run (fork PR, Dependabot, or not configured). See docs/DEVELOPERS.md, Tier 2 in CI."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        uses: ./.github/actions/deps
        with:
          node-version: '22'

      # The Build job's output when it ran; v* tags skip Build, so they build here.
      - name: Download build output
        if: steps.gate.outputs.enabled == 'true' && needs.build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output

      - name: Unpack build output
        if: steps.gate.outputs.enabled == 'true' && needs.build.result == 'success'
        shell: bash
        run: |
          tar -xf "$RUNNER_TEMP/build-output/build-output.tar"
          jq -r '.files[]|"\(.sha256)  \(.path)"' "$RUNNER_TEMP/build-output/build-manifest.json" | sha256sum -c --quiet

      - name: Build
        if: steps.gate.outputs.enabled == 'true' && needs.build.result != 'success'
        run: npm run build

      - name: Install Copilot CLI and SDK
        if: steps.gate.outputs.enabled == 'true'
        run: |
          # The SDK is an optional peer: global install, no bundled runtime
          # (--omit=optional), no koffi build (--ignore-scripts). The smoke
          # finds it via `npm root -g` and drives the installed CLI instead.
          npm install --global --no-audit --no-fund --omit=optional --ignore-scripts "@github/copilot-sdk@$SMOKE_SDK_RANGE"
          npm install --global --no-audit --no-fund "@github/copilot@$SMOKE_CLI_DIST_TAG"
          command -v copilot
          copilot --version

      - name: Install the OS sandbox backend
        if: steps.gate.outputs.enabled == 'true'
        run: |
          # Copilot's Linux sandbox runs shells under bubblewrap, with
          # slirp4netns for the network and uidmap's newuidmap/newgidmap. With
          # them, sdk.sandbox reports `supported` and the sandbox-lane
          # scenario's lanes run enforced.
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap slirp4netns uidmap
          bwrap --version
          # This job exists to prove the sandbox really launches. Ubuntu 24.04
          # restricts unprivileged user namespaces through AppArmor, so bwrap
          # fails with `loopback: Failed RTM_NEWADDR` and the host probe
          # reports `launch-blocked`. Lift the restriction on this throwaway
          # runner (docs/REFERENCE.md, "Linux: restricted user namespaces").
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --unshare-all --die-with-parent -- true
          echo "bwrap trial launch ok"

      - name: Prepare isolated smoke dirs
        if: steps.gate.outputs.enabled == 'true'
        run: |
          # Empty user COPILOT_HOME: no stored login, so the token env is the
          # only credential. TMPDIR keeps every --keep-home dir under one root.
          SMOKE_ROOT="$RUNNER_TEMP/copilot-smoke"
          mkdir -p "$SMOKE_ROOT/user-home" "$SMOKE_ROOT/tmp" "$SMOKE_ROOT/reports"
          printf 'SMOKE_ROOT=%s\n' "$SMOKE_ROOT" >> "$GITHUB_ENV"
          printf 'COPILOT_HOME=%s\n' "$SMOKE_ROOT/user-home" >> "$GITHUB_ENV"
          printf 'TMPDIR=%s\n' "$SMOKE_ROOT/tmp" >> "$GITHUB_ENV"

      - name: Tier 2 static checks (no model call)
        if: steps.gate.outputs.enabled == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set +e
          node bridge/cli.cjs smoke copilot --tier 2 --sdk-static --keep-home --json > "$SMOKE_ROOT/reports/static.json" 2> "$SMOKE_ROOT/reports/static.stderr.txt"
          status=$?
          set -e
          jq -r '.checks[] | "\(if .ok then "ok  " else "FAIL" end) \(.id): \(.detail)"' "$SMOKE_ROOT/reports/static.json" || cat "$SMOKE_ROOT/reports/static.json"
          # The free sandbox probe: an unsupported host passes (lanes fail closed) but should not happen here.
          if ! jq -e '.checks[] | select(.id == "sdk.sandbox") | .detail | startswith("supported")' "$SMOKE_ROOT/reports/static.json" > /dev/null; then
            echo "::warning title=OS sandbox not supported::sdk.sandbox does not report supported on this runner; see the static check output above."
          fi
          echo "omg smoke copilot --sdk-static exit $status"
          exit "$status"

      - name: Tier 2 default scenarios (tags only, ~0.6 AI credits)
        if: steps.gate.outputs.enabled == 'true' && github.event_name == 'push' && github.ref_type == 'tag'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          # Explicit opt-in marker for billed scenarios; only the vitest guard reads it.
          OMC_LIVE_SMOKE: '2'
        run: |
          set +e
          node bridge/cli.cjs smoke copilot --tier 2 --keep-home --json > "$SMOKE_ROOT/reports/scenarios.json" 2> "$SMOKE_ROOT/reports/scenarios.stderr.txt"
          status=$?
          set -e
          jq -r '.checks[] | "\(if .ok then "ok  " else "FAIL" end) \(.id): \(.detail)"' "$SMOKE_ROOT/reports/scenarios.json" || cat "$SMOKE_ROOT/reports/scenarios.json"
          jq -r '"cost: \(.cost.credits // "?") AI credit(s), legacy \(.cost.premiumRequests // "?") premium request(s)"' "$SMOKE_ROOT/reports/scenarios.json" || true
          echo "omg smoke copilot --tier 2 exit $status"
          exit "$status"

      - name: Tier 2 opt-in scenarios (smoke_scenarios input / COPILOT_SMOKE_OPT_IN on tags)
        if: steps.gate.outputs.enabled == 'true' && env.SMOKE_OPT_IN != ''
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          OMC_LIVE_SMOKE: '2'
        run: |
          # The list reaches the shell only through env; names are lowercase words, commas and dashes.
          if [[ ! $SMOKE_OPT_IN =~ ^[a-z][a-z,-]*$ ]]; then
            echo "::error::smoke scenario list must match ^[a-z][a-z,-]*\$, got: $SMOKE_OPT_IN"
            exit 1
          fi
          set +e
          node bridge/cli.cjs smoke copilot --tier 2 --scenario "$SMOKE_OPT_IN" --keep-home --json > "$SMOKE_ROOT/reports/opt-in.json" 2> "$SMOKE_ROOT/reports/opt-in.stderr.txt"
          status=$?
          set -e
          jq -r '.checks[] | "\(if .ok then "ok  " else "FAIL" end) \(.id): \(.detail)"' "$SMOKE_ROOT/reports/opt-in.json" || cat "$SMOKE_ROOT/reports/opt-in.json"
          jq -r '"cost: \(.cost.credits // "?") AI credit(s), legacy \(.cost.premiumRequests // "?") premium request(s)"' "$SMOKE_ROOT/reports/opt-in.json" || true
          echo "omg smoke copilot --tier 2 --scenario $SMOKE_OPT_IN exit $status"
          exit "$status"

      - name: Stage smoke artifacts
        if: always() && steps.gate.outputs.enabled == 'true'
        run: |
          # Detached hook children (SessionEnd workers, cache-occupancy
          # publishers) outlive the smoke and rewrite or delete files under the
          # kept homes; zipping the live dir failed with ENOENT on
          # .omg/cache-occupancy/<hash>.json (v5.12.2 tag run). Wait briefly for
          # them, then snapshot the dir without the volatile caches. Only the
          # snapshot is leak-scanned and uploaded.
          SMOKE_ROOT="${SMOKE_ROOT:-$RUNNER_TEMP/copilot-smoke}"
          STAGE="$RUNNER_TEMP/copilot-smoke-upload"
          rm -rf "$STAGE"
          [ -d "$SMOKE_ROOT" ] || exit 0
          for _ in $(seq 1 15); do
            pgrep -f "$GITHUB_WORKSPACE/(scripts|dist|bridge)/" > /dev/null || break
            sleep 2
          done
          pgrep -af "$GITHUB_WORKSPACE/(scripts|dist|bridge)/" && echo "::notice::hook children still running after 30 s; snapshotting anyway" || true
          mkdir -p "$STAGE"
          set +e
          # The .node binaries under a relocated profile's .cache/copilot/pkg/
          # (COPILOT_CACHE_HOME) are the Copilot CLI runtime the canary downloads,
          # not an artifact; runtime.node holds token-shaped strings that trip the
          # scan. The rest of that tree is still staged and scanned.
          rsync -a --exclude='cache-occupancy/' --exclude='*.lock' --exclude='**/.cache/copilot/pkg/**/*.node' "$SMOKE_ROOT/" "$STAGE/"
          status=$?
          set -e
          # 24 = some source files vanished during the copy (a late child): the snapshot is still usable.
          if [ "$status" -ne 0 ] && [ "$status" -ne 24 ]; then
            echo "::error::rsync of the smoke artifacts failed ($status)"
            exit "$status"
          fi
          du -sh "$STAGE"

      - name: Check smoke artifacts for token leaks
        id: leak-check
        if: always() && steps.gate.outputs.enabled == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          # Fail closed and delete the snapshot: nothing token-shaped may be uploaded.
          # No -I: binary files (session-store.db) are scanned too.
          STAGE="$RUNNER_TEMP/copilot-smoke-upload"
          [ -d "$STAGE" ] || exit 0
          leaked=0
          if grep -rlE 'gh[opsur]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' "$STAGE"; then leaked=1; fi
          if printf '%s\n' "$COPILOT_GITHUB_TOKEN" | grep -rlF -f - "$STAGE"; then leaked=1; fi
          if [ "$leaked" -ne 0 ]; then
            rm -rf "$STAGE"
            echo "::error::token-shaped string in the smoke artifacts (files above); artifacts deleted, not uploaded"
            exit 1
          fi
          echo "no token-shaped strings under $STAGE"

      - name: Upload smoke report and artifacts
        if: always() && steps.gate.outputs.enabled == 'true' && steps.leak-check.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: copilot-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/copilot-smoke-upload/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Moved from upgrade-test.yml (same check name) so it can use the Build
  # job's tarball. Not on tags, as before.
  upgrade-test:
    name: omg update + session-start hook
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20

    steps:
      # ── 1. Environment ──────────────────────────────────────────────────────

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 2. Install Claude Code ────────────────────────────────────────────────
      # Keep Claude Code installed in CI so the upgrade path still runs in a
      # realistic environment, but avoid relying on Claude runtime behavior for
      # hook verification. Step 6 validates the installed SessionStart hook
      # directly from repo-owned artifacts and therefore runs on push + PR.

      # ENOTEMPTY hardening: the toolcache global lib/node_modules dir is reused
      # across runs on GitHub-hosted runners (and inside the GitHub-hosted tool
      # cache). A previously interrupted `npm install -g` can leave the resolved
      # scoped package dir and/or npm's staging temp dirs behind, so the next
      # install fails with
      #   npm error ENOTEMPTY: directory not empty, rename
      #     '.../@anthropic-ai/claude-code' -> '.../@anthropic-ai/.claude-code-XXXX'
      # (observed in run 27492794574). Install Claude Code into an isolated npm
      # global prefix under RUNNER_TEMP so the install never depends on or
      # mutates the shared toolcache global dir, and retry with a fresh prefix to
      # absorb any residual rename race. A persistent failure still exits
      # non-zero (we never swallow the final failure).
      - name: Install Claude Code
        run: |
          set -euo pipefail

          CLAUDE_CODE_PREFIX="$RUNNER_TEMP/claude-code-global"

          reset_prefix() {
            rm -rf "${CLAUDE_CODE_PREFIX:?}" 2>/dev/null || true
            mkdir -p "$CLAUDE_CODE_PREFIX"
          }

          reset_prefix

          ATTEMPTS=3
          INSTALLED=false
          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "Installing @anthropic-ai/claude-code (attempt $attempt/$ATTEMPTS)"
            if npm install -g --prefix "$CLAUDE_CODE_PREFIX" \
                @anthropic-ai/claude-code --no-audit --no-fund; then
              INSTALLED=true
              break
            fi
            echo "Install attempt $attempt failed; recreating isolated prefix and retrying."
            reset_prefix
            sleep 2
          done

          if [ "$INSTALLED" != "true" ]; then
            echo "FAIL: npm install -g @anthropic-ai/claude-code failed after $ATTEMPTS attempts"
            exit 1
          fi

          # Expose the isolated prefix bin dir to this and subsequent steps so
          # `claude` resolves on PATH (e.g. the "Verify Claude Code is on PATH"
          # step's `which claude`).
          echo "$CLAUDE_CODE_PREFIX/bin" >> "$GITHUB_PATH"
          export PATH="$CLAUDE_CODE_PREFIX/bin:$PATH"
          claude --version

      - name: Verify Claude Code is on PATH
        run: which claude

      # ── 3. Install omc@4.13.79 via npm ────────────────────────────────────────
      # Establishes the "old version" baseline before the update is run.
      #
      # ENOTEMPTY hardening: the global node_modules dir is reused across runs on
      # GitHub-hosted runners (and within the GitHub-hosted tool cache). A
      # previously interrupted `npm install -g` can leave behind the resolved
      # package dir and/or npm's staging temp dirs (`.oh-my-copilot-*`),
      # which makes the next install fail with
      #   npm ERR! ENOTEMPTY: directory not empty, rename '.../oh-my-copilot'
      #     -> '.../.oh-my-copilot-XXXXXXXX'
      # and, on rerun, appear to hang. Remove any stale global package + npm
      # staging dirs before installing, then retry the install a few times so a
      # transient rename race does not fail the run. Persistent install failures
      # still surface as a non-zero exit (we never swallow the final failure).

      - name: Install omc v4.13.79 via npm
        run: |
          set -euo pipefail

          PKG=oh-my-copilot
          GLOBAL_ROOT="$(npm root -g)"

          clean_stale_global_pkg() {
            # Remove the resolved global package dir plus any npm staging temp
            # dirs left over from an interrupted global install. `:?` guards
            # against an empty GLOBAL_ROOT so we never rm -rf "/".
            rm -rf "${GLOBAL_ROOT:?}/$PKG" 2>/dev/null || true
            find "$GLOBAL_ROOT" -maxdepth 1 -name ".$PKG-*" -exec rm -rf {} + 2>/dev/null || true
          }

          clean_stale_global_pkg

          ATTEMPTS=3
          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "Installing $PKG@4.13.79 (attempt $attempt/$ATTEMPTS)"
            if npm install -g "$PKG@4.13.79" --no-audit --no-fund; then
              echo "Installed $PKG@4.13.79"
              exit 0
            fi
            echo "Install attempt $attempt failed; cleaning stale global state and retrying."
            clean_stale_global_pkg
            sleep 2
          done

          echo "FAIL: npm install -g $PKG@4.13.79 failed after $ATTEMPTS attempts"
          exit 1

      - name: Verify omc version is 4.13.79
        run: |
          oh-my-copilot --version > "$RUNNER_TEMP/omc-pre-update.version" 2>&1
          VERSION_EXIT=$?
          INSTALLED_VERSION=$(cat "$RUNNER_TEMP/omc-pre-update.version")

          if [ "$VERSION_EXIT" -ne 0 ]; then
            echo "FAIL: oh-my-copilot --version exited with code $VERSION_EXIT"
            cat "$RUNNER_TEMP/omc-pre-update.version"
            exit 1
          fi

          echo "Installed omc version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "4.13.79" ]; then
            echo "Expected version 4.13.79, got: $INSTALLED_VERSION"
            exit 1
          fi

      # ── 4. Run omg update and verify clean stdout only ───────────────────────
      # omg update must:
      #   - Exit 0
      #   - Produce zero stderr
      # Any npm warnings, git warnings, or sync messages to stderr are failures.
      # Note: syncMarketplaceClone() is best-effort and skips gracefully when
      # the marketplace clone (~/.copilot/plugins/marketplaces/omc/) doesn't exist,
      # so CI runners with a fresh home directory are handled correctly.
      #
      # dev can legitimately carry a package/release-notes version bump before
      # that version is published to npm. In that window the old 4.13.79 updater
      # still tries `npm install -g ...@latest`, which fails with ETARGET before
      # any current update/reconcile code can run. Keep the real `oh-my-copilot update`
      # path when the current package version exists on npm; otherwise install
      # the just-built local package tarball and run the same post-update
      # reconciliation command directly. This preserves deterministic coverage
      # for OMC-owned install, reconcile, and SessionStart artifacts without
      # requiring release publishing from CI.

      # The Build job's `npm pack --ignore-scripts` tarball replaces a local
      # `npm run build` + `npm pack` here.
      - name: Download build output for deterministic fallback
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output

      - name: Prepare local package tarball
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TARBALL_NAME="$(jq -r .tarball "$RUNNER_TEMP/build-output/build-manifest.json")"
          test -s "$RUNNER_TEMP/build-output/$TARBALL_NAME"
          echo "$(jq -r .tarballSha256 "$RUNNER_TEMP/build-output/build-manifest.json")  $RUNNER_TEMP/build-output/$TARBALL_NAME" | sha256sum -c --quiet
          cp "$RUNNER_TEMP/build-output/$TARBALL_NAME" "$RUNNER_TEMP/$TARBALL_NAME"
          {
            echo "OMC_UPGRADE_TEST_EXPECTED_VERSION=$CURRENT_PACKAGE_VERSION"
            echo "OMC_UPGRADE_TEST_TARBALL=$RUNNER_TEMP/$TARBALL_NAME"
          } >> "$GITHUB_ENV"

          if npm view "oh-my-copilot@$CURRENT_PACKAGE_VERSION" version >/dev/null 2>&1; then
            set +e
            GITHUB_LATEST_VERSION="$(node -e '
              const headers = { "User-Agent": "omc-upgrade-test" };
              if (process.env.GITHUB_TOKEN) headers.Authorization = `Bearer ${process.env.GITHUB_TOKEN}`;

              fetch("https://api.github.com/repos/RobinNorberg/oh-my-copilot/releases/latest", { headers })
                .then(async response => {
                  if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
                  const release = await response.json();
                  process.stdout.write(String(release.tag_name || "").replace(/^v/, ""));
                })
                .catch(error => {
                  console.error(error instanceof Error ? error.message : String(error));
                  process.exit(1);
                });
            ' 2>"$RUNNER_TEMP/github-latest-release.stderr")"
            GITHUB_LATEST_EXIT=$?
            set -e

            if [ "$GITHUB_LATEST_EXIT" -ne 0 ] || [ -z "$GITHUB_LATEST_VERSION" ]; then
              echo "OMC_UPGRADE_TEST_USE_LOCAL_TARBALL=true" >> "$GITHUB_ENV"
              echo "GitHub latest release lookup failed or returned empty; testing local tarball + update-reconcile."
              if [ -s "$RUNNER_TEMP/github-latest-release.stderr" ]; then
                echo "GitHub latest release lookup stderr:"
                cat "$RUNNER_TEMP/github-latest-release.stderr"
              fi
            elif [ "$GITHUB_LATEST_VERSION" = "$CURRENT_PACKAGE_VERSION" ]; then
              echo "OMC_UPGRADE_TEST_USE_LOCAL_TARBALL=false" >> "$GITHUB_ENV"
              echo "Package $CURRENT_PACKAGE_VERSION is published and GitHub latest matches; testing the live oh-my-copilot update path."
            else
              echo "OMC_UPGRADE_TEST_USE_LOCAL_TARBALL=true" >> "$GITHUB_ENV"
              echo "Package $CURRENT_PACKAGE_VERSION is published, but GitHub latest is $GITHUB_LATEST_VERSION; testing local tarball + update-reconcile."
            fi
          else
            echo "OMC_UPGRADE_TEST_USE_LOCAL_TARBALL=true" >> "$GITHUB_ENV"
            echo "Package $CURRENT_PACKAGE_VERSION is not published; testing local tarball + update-reconcile."
          fi

      - name: Run omg update
        id: omc-update
        env:
          # Suppress npm update progress bar to keep stdout clean
          npm_config_progress: 'false'
        run: |
          set -o pipefail

          # Capture exit code of the update itself (or the deterministic
          # unpublished-version fallback). npm install may emit deprecation
          # warnings to stderr — those are not omc errors. Filter those out and
          # fail on everything else.
          set +e
          if [ "$OMC_UPGRADE_TEST_USE_LOCAL_TARBALL" = "true" ]; then
            {
              echo "Using local package tarball because deterministic fallback is required for $OMC_UPGRADE_TEST_EXPECTED_VERSION."
              npm install -g "$OMC_UPGRADE_TEST_TARBALL"
              omg update-reconcile
            } 1>"$RUNNER_TEMP/omc-update.stdout.log" 2>"$RUNNER_TEMP/omc-update.stderr.log"
            UPDATE_EXIT=$?
          else
            oh-my-copilot update 1>"$RUNNER_TEMP/omc-update.stdout.log" 2>"$RUNNER_TEMP/omc-update.stderr.log"
            UPDATE_EXIT=$?
            LIVE_UPDATED_VERSION="$(oh-my-copilot --version 2>/dev/null || true)"
            if [ "$LIVE_UPDATED_VERSION" = "4.13.79" ]; then
              {
                echo "Live oh-my-copilot update left version at 4.13.79; falling back to local tarball + update-reconcile."
                npm install -g "$OMC_UPGRADE_TEST_TARBALL"
                omg update-reconcile
              } >>"$RUNNER_TEMP/omc-update.stdout.log" 2>>"$RUNNER_TEMP/omc-update.stderr.log"
              UPDATE_EXIT=$?
            fi
          fi
          set -e

          # Check for non-npm stderr (omc warnings/errors/exceptions)
          # Exclude npm deprecation warnings: "npm deprecated ...".
          # All other stderr lines (omc console.warn, error, exception, fail patterns) are failures.
          if grep -vE '^npm deprecated ' "$RUNNER_TEMP/omc-update.stderr.log" 2>/dev/null | grep -qiE '^(error|exception|fail|critical|warn|omc)'; then
            echo "FAIL: omg update produced stderr:"
            cat "$RUNNER_TEMP/omc-update.stderr.log"
            echo "Full stdout:"
            cat "$RUNNER_TEMP/omc-update.stdout.log"
            exit 1
          fi

          if [ "$UPDATE_EXIT" -ne 0 ]; then
            echo "FAIL: omg update exited with code $UPDATE_EXIT"
            echo "Full stdout:"
            cat "$RUNNER_TEMP/omc-update.stdout.log"
            echo "Full stderr:"
            cat "$RUNNER_TEMP/omc-update.stderr.log"
            exit 1
          fi

          if [ "$OMC_UPGRADE_TEST_USE_LOCAL_TARBALL" = "true" ]; then
            echo "PASS: local tarball install + update-reconcile succeeded"
          else
            echo "PASS: omg update succeeded"
          fi

      # ── 5. Verify new omc version installed ──────────────────────────────────

      - name: Verify omc version after update
        run: |
          omg --version > "$RUNNER_TEMP/omc-post-update.version" 2>&1
          VERSION_EXIT=$?
          UPDATED_VERSION=$(cat "$RUNNER_TEMP/omc-post-update.version")

          if [ "$VERSION_EXIT" -ne 0 ]; then
            echo "FAIL: omg --version exited with code $VERSION_EXIT"
            cat "$RUNNER_TEMP/omc-post-update.version"
            exit 1
          fi

          echo "Updated omc version: $UPDATED_VERSION"
          if [ -z "$UPDATED_VERSION" ]; then
            echo "FAIL: omg --version returned empty"
            exit 1
          fi
          if [ "$UPDATED_VERSION" = "4.13.79" ]; then
            echo "FAIL: omc version still 4.13.79 after update"
            exit 1
          fi
          if [ "$OMC_UPGRADE_TEST_USE_LOCAL_TARBALL" = "true" ] && [ "$UPDATED_VERSION" != "$OMC_UPGRADE_TEST_EXPECTED_VERSION" ]; then
            echo "FAIL: local tarball fallback installed $UPDATED_VERSION, expected $OMC_UPGRADE_TEST_EXPECTED_VERSION"
            exit 1
          fi
          echo "PASS: omc updated from 4.13.79 to $UPDATED_VERSION"

      # ── 6. Verify SessionStart hook wiring + execution ───────────────────────
      # Validate the update-owned coverage directly:
      #   - settings.json contains a SessionStart command for session-start.mjs
      #   - the installed standalone hook script exists
      #   - the hook script runs successfully on representative SessionStart JSON
      #
      # This keeps upgrade coverage inside OMC-owned artifacts and avoids relying
      # on external Claude CLI print-mode behavior in headless CI.
      - name: Verify SessionStart hook wiring and script
        run: |
          set -o pipefail

          COPILOT_HOME="${COPILOT_HOME:-$HOME/.copilot}"
          SESSION_HOOK="$COPILOT_HOME/hooks/session-start.mjs"
          SETTINGS_PATH="$COPILOT_HOME/settings.json"

          if [ ! -f "$SESSION_HOOK" ]; then
            echo "FAIL: missing SessionStart hook script at $SESSION_HOOK"
            exit 1
          fi

          if [ ! -f "$SETTINGS_PATH" ]; then
            echo "FAIL: missing Claude settings at $SETTINGS_PATH"
            exit 1
          fi

          SESSION_COMMAND="$(node -e '
            const fs = require("fs");
            const settings = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const groups = settings.hooks?.SessionStart ?? [];
            const command = groups
              .flatMap(group => group?.hooks ?? [])
              .find(hook => hook?.type === "command" && typeof hook.command === "string" && hook.command.includes("session-start.mjs"))
              ?.command ?? "";
            process.stdout.write(command);
          ' "$SETTINGS_PATH")"

          if [ -z "$SESSION_COMMAND" ]; then
            echo "FAIL: settings.json is missing a SessionStart command for session-start.mjs"
            cat "$SETTINGS_PATH"
            exit 1
          fi

          set +e
          printf '%s' \
            "{\"hook_event_name\":\"SessionStart\",\"session_id\":\"ci-upgrade-test\",\"cwd\":\"$GITHUB_WORKSPACE\"}" \
            | node "$SESSION_HOOK" 1>"$RUNNER_TEMP/session.stdout.log" 2>"$RUNNER_TEMP/session.stderr.log"
          SESSION_EXIT=$?
          set -e

          if [ "$SESSION_EXIT" -ne 0 ]; then
            echo "FAIL: SessionStart hook exited with code $SESSION_EXIT"
            echo "stderr:"
            cat "$RUNNER_TEMP/session.stderr.log"
            echo "stdout:"
            cat "$RUNNER_TEMP/session.stdout.log"
            exit 1
          fi

          if [ -s "$RUNNER_TEMP/session.stderr.log" ]; then
            echo "FAIL: SessionStart hook produced stderr:"
            cat "$RUNNER_TEMP/session.stderr.log"
            echo "stdout:"
            cat "$RUNNER_TEMP/session.stdout.log"
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const output = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (output.continue !== true) {
              throw new Error("SessionStart hook did not return continue=true");
            }
            const hookName = output.hookSpecificOutput?.hookEventName;
            if (hookName !== undefined && hookName !== "SessionStart") {
              throw new Error(`Unexpected hookSpecificOutput.hookEventName: ${hookName}`);
            }
          ' "$RUNNER_TEMP/session.stdout.log"

          echo "PASS: SessionStart hook is configured and executes cleanly"

  # Aggregates every blocking job: fails when any needed job failed or was
  # cancelled, passes when each succeeded or was skipped. The advisory
  # No Committed Build Artifacts and the tag-only release are not needed.
  ci-gate:
    name: CI Gate
    if: ${{ always() && (github.event_name != 'push' || github.ref_type != 'tag') }}
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - test
      - test-windows
      - better-sqlite3-node26-ubuntu
      - better-sqlite3-node26-windows
      - test-precompact-restore-ubuntu
      - test-precompact-restore-macos
      - test-precompact-restore-windows
      - build
      - multirepo-paths-gate-ubuntu
      - multirepo-paths-gate-windows
      - version-check
      - npm-pack-test
      - smoke
      - upgrade-test
    steps:
      - name: Check needed job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error title=CI Gate::not success or skipped: $bad"
            exit 1
          fi
          echo "every needed job succeeded or was skipped"

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    concurrency:
      group: npm-trusted-publish-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Pin npm for attestation verification
        run: |
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"

      - name: Install dependencies
        run: npm ci

      - name: Assert release trigger and npm availability
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git fetch --no-tags --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          TAG_OBJECT=$(git rev-parse --verify "refs/tags/$GITHUB_REF_NAME")
          test "$(git cat-file -t "$TAG_OBJECT")" = "tag"
          RELEASE_SHA=$(git rev-parse --verify "refs/tags/$GITHUB_REF_NAME^{}")
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          node scripts/release-boundary.mjs assert-trigger --tag "$GITHUB_REF_NAME" --sha "$RELEASE_SHA"
          node scripts/release-boundary.mjs assert-npm-absent --package oh-my-copilot --version "$VERSION"

      - name: Validate release notes
        run: |
          git cat-file -e HEAD:.github/release-body.md
          test -s .github/release-body.md
          cp .github/release-body.md "$RUNNER_TEMP/release-notes.md"

      - name: Verify plugin shipping surface
        run: npm run plugin:shipping:verify

      - name: Build
        run: npm run build

      - name: Run functional tests
        run: npm test -- --run

      - name: Run subagent-lock performance test
        run: npm exec vitest -- run tests/perf/subagent-lock.bench.ts --fileParallelism=false --maxWorkers=1

      # Some tests execute scripts/plugin-setup.mjs against the real
      # hooks/hooks.json and rewrite bare `node` to the absolute node binary
      # path of the runner (e.g. /opt/hostedtoolcache/node/.../bin/node). If we
      # let that mutated file ship, every end user inherits a node path that
      # does not exist on their machine. Restore the file to its committed
      # state before publishing. See issue #2348.
      - name: Restore hooks.json before publish
        run: git checkout -- hooks/hooks.json

      - name: Assert clean deterministic tracked tree before archive
        run: |
          # Build/test preparation may regenerate the known tracked build
          # closure and the hook projection. Restore only those known paths;
          # the release-notes copy lives outside the checkout.
          git restore --worktree dist bridge hooks/hooks.json
          git clean -fdX dist
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Create staged release archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SEED_DIR="$RUNNER_TEMP/seed"
          STAGE="$RUNNER_TEMP/release-stage"
          FINAL_DIR="$RUNNER_TEMP/final"
          EVIDENCE_JSON="$RUNNER_TEMP/release-evidence.json"
          mkdir -p "$SEED_DIR" "$FINAL_DIR"
          SEED_NAME=$(npm pack --ignore-scripts --pack-destination "$SEED_DIR" --silent)
          SEED_TARBALL="$SEED_DIR/$SEED_NAME"
          node scripts/release-boundary.mjs prepare-stage --seed-tarball "$SEED_TARBALL" --stage "$STAGE" --git-head "$GITHUB_SHA"
          FINAL_NAME=$(npm pack "$STAGE/package" --ignore-scripts --pack-destination "$FINAL_DIR" --silent)
          FINAL_TARBALL="$FINAL_DIR/$FINAL_NAME"
          FINAL_TARBALL_SHA256=$(sha256sum "$FINAL_TARBALL" | cut -d ' ' -f 1)
          node scripts/release-boundary.mjs assert-archive --tarball "$FINAL_TARBALL" --version "$VERSION" --git-head "$GITHUB_SHA"
          node scripts/release-boundary.mjs write-evidence --tarball "$FINAL_TARBALL" --output "$EVIDENCE_JSON"
          printf 'FINAL_TARBALL=%s\n' "$FINAL_TARBALL" >> "$GITHUB_ENV"
          printf 'EVIDENCE_JSON=%s\n' "$EVIDENCE_JSON" >> "$GITHUB_ENV"
          printf 'FINAL_TARBALL_SHA256=%s\n' "$FINAL_TARBALL_SHA256" >> "$GITHUB_ENV"

      - name: Smoke test staged archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SMOKE_ROOT="$RUNNER_TEMP/release-smoke"
          SMOKE_PREFIX="$SMOKE_ROOT/package"
          SMOKE_HOME="$SMOKE_ROOT/home"
          SMOKE_COPILOT_HOME="$SMOKE_HOME/.copilot"
          SMOKE_GJC_CONFIG_DIR="$SMOKE_HOME/.gjc"
          SMOKE_PROJECT="$SMOKE_ROOT/project"
          rm -rf "$SMOKE_ROOT"
          mkdir -p "$SMOKE_HOME" "$SMOKE_PROJECT" "$SMOKE_COPILOT_HOME" "$SMOKE_GJC_CONFIG_DIR"
          npm install --ignore-scripts --prefix "$SMOKE_PREFIX" "$FINAL_TARBALL"
          SMOKE_PACKAGE_ROOT="$SMOKE_PREFIX/node_modules/oh-my-copilot"
          test -f "$SMOKE_PACKAGE_ROOT/bridge/claude-md-coordinator.cjs"
          test -f "$SMOKE_PACKAGE_ROOT/scripts/setup-claude-md.sh"
          test -f "$SMOKE_PACKAGE_ROOT/scripts/lib/config-dir.sh"
          test -f "$SMOKE_PACKAGE_ROOT/scripts/setup-claude-md.mjs"
          test -f "$SMOKE_PACKAGE_ROOT/scripts/setup-progress.mjs"
          test -f "$SMOKE_PACKAGE_ROOT/scripts/setup-config.mjs"
          test -f "$SMOKE_PACKAGE_ROOT/scripts/uninstall.mjs"
          test -f "$SMOKE_PACKAGE_ROOT/scripts/lib/config-dir.mjs"
          test -s "$SMOKE_PACKAGE_ROOT/skills/wiki/SKILL.md"
          test -f "$SMOKE_PACKAGE_ROOT/skills/omc-setup/SKILL.md"
          test -f "$SMOKE_PACKAGE_ROOT/skills/omc-setup/phases/01-install-claude-md.md"
          test "$(env -i PATH="$PATH" HOME="$SMOKE_HOME" COPILOT_HOME="$SMOKE_COPILOT_HOME" GJC_CONFIG_DIR="$SMOKE_GJC_CONFIG_DIR" OMC_SETUP_PLUGIN_ROOT="$SMOKE_PACKAGE_ROOT" CLAUDE_PLUGIN_ROOT="$SMOKE_PACKAGE_ROOT" "$SMOKE_PREFIX/node_modules/.bin/omg" --version)" = "$VERSION"
          env -i PATH="$PATH" HOME="$SMOKE_HOME" COPILOT_HOME="$SMOKE_COPILOT_HOME" GJC_CONFIG_DIR="$SMOKE_GJC_CONFIG_DIR" OMC_SETUP_PLUGIN_ROOT="$SMOKE_PACKAGE_ROOT" CLAUDE_PLUGIN_ROOT="$SMOKE_PACKAGE_ROOT" "$SMOKE_PREFIX/node_modules/.bin/omg" --help
          API_HELP=$(env -i PATH="$PATH" HOME="$SMOKE_HOME" COPILOT_HOME="$SMOKE_COPILOT_HOME" GJC_CONFIG_DIR="$SMOKE_GJC_CONFIG_DIR" OMC_SETUP_PLUGIN_ROOT="$SMOKE_PACKAGE_ROOT" CLAUDE_PLUGIN_ROOT="$SMOKE_PACKAGE_ROOT" "$SMOKE_PREFIX/node_modules/.bin/omg-cli" team api --help)
          case "$API_HELP" in
            *recover-worker*write-task-checkpoint*read-recovery-result*) ;;
            *)
              echo "omg-cli team api help is missing required recovery commands" >&2
              exit 1
              ;;
          esac
          cd "$SMOKE_PROJECT"
          env -i PATH="$PATH" HOME="$SMOKE_HOME" COPILOT_HOME="$SMOKE_COPILOT_HOME" GJC_CONFIG_DIR="$SMOKE_GJC_CONFIG_DIR" OMC_SETUP_PLUGIN_ROOT="$SMOKE_PACKAGE_ROOT" CLAUDE_PLUGIN_ROOT="$SMOKE_PACKAGE_ROOT" bash -c 'node "${OMC_SETUP_PLUGIN_ROOT:-${CLAUDE_PLUGIN_ROOT}}/scripts/setup-claude-md.mjs" local'
          cmp "$SMOKE_PACKAGE_ROOT/docs/CLAUDE.md" "$SMOKE_PROJECT/.claude/CLAUDE.md"
          cmp "$SMOKE_PACKAGE_ROOT/skills/wiki/SKILL.md" "$SMOKE_PROJECT/.claude/skills/wiki/SKILL.md"
          COORDINATOR_SHA256=$(sha256sum "$SMOKE_PACKAGE_ROOT/bridge/claude-md-coordinator.cjs" | cut -d ' ' -f 1)
          test "$FINAL_TARBALL_SHA256" = "$(sha256sum "$FINAL_TARBALL" | cut -d ' ' -f 1)"
          test "$COORDINATOR_SHA256" = "$(node -e 'const fs = require("node:fs"); const crypto = require("node:crypto"); process.stdout.write(crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"));' "$SMOKE_PACKAGE_ROOT/bridge/claude-md-coordinator.cjs")"
          test "$COORDINATOR_SHA256" = "$(node -e 'const evidence = require(process.argv[1]); const file = evidence.archiveManifest.files.find(({ path }) => path === "package/bridge/claude-md-coordinator.cjs"); process.stdout.write(file?.sha256 ?? "");' "$EVIDENCE_JSON")"
          test "$(node -p 'require(process.argv[1]).gitHead' "$SMOKE_PACKAGE_ROOT/package.json")" = "$GITHUB_SHA"
          test "$(node -p 'require(process.argv[1]).sourceSha' "$EVIDENCE_JSON")" = "$GITHUB_SHA"
          test "$(node -p 'require(process.argv[1]).sha256' "$EVIDENCE_JSON")" = "$FINAL_TARBALL_SHA256"

      - name: Upload release archive evidence
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-boundary-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/final/*.tgz
            ${{ runner.temp }}/release-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact archive and verify registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          set -o pipefail
          npm publish "$FINAL_TARBALL" --ignore-scripts --access public --provenance 2>&1 | tee npm-publish.log
          VERIFICATION_PREFIX="$RUNNER_TEMP/npm-provenance-verification"
          AUDIT_JSON="$VERIFICATION_PREFIX/audit-signatures.json"
          # The archive is already on the registry at this point: everything below
          # only waits for it to become visible. The budget must outlast real
          # propagation (#4083 saw the version land 1.7s after a 12-attempt
          # window gave up), so keep ~28 minutes of polling.
          MAX_PROPAGATION_ATTEMPTS=30
          ATTEMPT=1
          BACKOFF_SECONDS=10
          while [ "$ATTEMPT" -le "$MAX_PROPAGATION_ATTEMPTS" ]; do
            rm -rf "$VERIFICATION_PREFIX"
            if npm install --ignore-scripts --no-audit --no-fund --prefix "$VERIFICATION_PREFIX" "oh-my-copilot@$VERSION" && npm audit signatures --json --include-attestations --prefix "$VERIFICATION_PREFIX" > "$AUDIT_JSON" && test -s "$AUDIT_JSON"; then
              break
            fi
            if [ "$ATTEMPT" -eq "$MAX_PROPAGATION_ATTEMPTS" ]; then
              echo "oh-my-copilot@$VERSION was PUBLISHED to the registry; it did not become visible after $MAX_PROPAGATION_ATTEMPTS attempts" >&2
              echo "do not republish: recover the GitHub Release with the Release Recovery workflow (tag=$GITHUB_REF_NAME sha=$GITHUB_SHA)" >&2
              exit 1
            fi
            ATTEMPT=$((ATTEMPT + 1))
            sleep "$BACKOFF_SECONDS"
            BACKOFF_SECONDS=$((BACKOFF_SECONDS * 2))
            if [ "$BACKOFF_SECONDS" -gt 60 ]; then
              BACKOFF_SECONDS=60
            fi
          done
          node scripts/release-boundary.mjs verify-registry --package oh-my-copilot --version "$VERSION" --tag "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" --evidence "$EVIDENCE_JSON" --tarball "$FINAL_TARBALL" --provenance required --audit "$AUDIT_JSON"

      - name: Upload finalized release evidence
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-boundary-final-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
