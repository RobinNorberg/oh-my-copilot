
      - name: Factory triage
        id: triage
        shell: bash
        run: |
          set +e
          npx --yes --package "oh-my-copilot@${OMG_VERSION}" omg factory triage --apply --json > heartbeat-triage.json
          code=$?
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          {
            echo '### omg factory triage --apply'
            echo "exit code: ${code}"
            echo '```json'
            head -c 20000 heartbeat-triage.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
