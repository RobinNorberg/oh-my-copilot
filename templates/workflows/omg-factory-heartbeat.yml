# omg-factory-heartbeat: generated by `omg factory setup --workflows` (oh-my-copilot @@VERSION@@).
# Mode: @@MODE@@. Re-run the command to re-render this file; it never overwrites a file it did not write without --force.
#
# Permissions (least privilege, declared below):
#   contents: read, pull-requests: read, issues: @@ISSUES@@
@@MODE_NOTE@@#
# What it does: reads the backlog with `omg factory check --json` and publishes the result as a job summary and an artifact.
# What it never does: start factory lanes, call Copilot, or use a secret other than the job's GITHUB_TOKEN.
# Triggers: schedule and workflow_dispatch only. No pull-request triggers, no fork code, no event text in scripts.
# Remove it: delete this file.
name: omg factory heartbeat

on:
  schedule:
    - cron: '@@CRON@@'
  workflow_dispatch:

permissions:
  contents: read
  issues: @@ISSUES@@
  pull-requests: read

concurrency:
  group: omg-factory-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      OMG_VERSION: '@@VERSION@@'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Factory check
        id: check
        shell: bash
        run: |
          set +e
          npx --yes --package "oh-my-copilot@${OMG_VERSION}" omg factory check --json > heartbeat-check.json
          code=$?
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          {
            echo '### omg factory check'
            echo "exit code: ${code}"
            echo '```json'
            head -c 20000 heartbeat-check.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
@@TRIAGE_STEP@@
      - name: Upload results
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: omg-factory-heartbeat
          path: heartbeat-*.json
          if-no-files-found: ignore

      - name: Fail on a real error
        shell: bash
        env:
          CHECK_CODE: ${{ steps.check.outputs.code }}
@@TRIAGE_ENV@@        run: |
          # 0 is fine; 6 means the engine is busy, which is fine too; empty means the step did not run.
          for c in "${CHECK_CODE}" "${TRIAGE_CODE}"; do
            case "${c}" in ''|0|6) ;; *) exit "${c}" ;; esac
          done
