# omg-factory-heartbeat: generated by `omg factory setup --workflows` (oh-my-copilot @@VERSION@@).
# Mode: @@MODE@@. Re-run the command to re-render this file; it never overwrites a file it did not write without --force.
#
# Permissions (least privilege, declared below):
#   contents: read, pull-requests: read, issues: @@ISSUES@@
@@MODE_NOTE@@#
# What it does: reads the backlog with `omg factory check --json` and publishes the result as a job summary and an artifact.
# What it never does: start factory lanes, call Copilot, or use a secret other than the job's GITHUB_TOKEN.
# The token is handed only to the steps that run omg. The install step has no token and skips install scripts.
# Triggers: schedule and workflow_dispatch only. No pull-request triggers, no fork code, no event text in scripts.
# Remove it: delete this file.
name: omg factory heartbeat

on:
  schedule:
    - cron: '@@CRON@@'
  workflow_dispatch:

permissions:
  contents: read
  issues: @@ISSUES@@
  pull-requests: read

concurrency:
  group: omg-factory-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMG_VERSION: '@@VERSION@@'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install omg (no token, no install scripts)
        shell: bash
        run: npm install -g --ignore-scripts "oh-my-copilot@${OMG_VERSION}"

      - name: Factory check
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          omg factory check --json > heartbeat-check.json
          code=$?
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          {
            echo '### omg factory check'
            echo "exit code: ${code}"
            echo '```json'
            # Backticks are rewritten as a unicode escape so an issue title cannot close the fence.
            head -c 20000 heartbeat-check.json | sed 's/`/\\u0060/g'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
@@TRIAGE_STEP@@
      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omg-factory-heartbeat
          path: heartbeat-*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail on a real error
        shell: bash
        env:
          CHECK_CODE: ${{ steps.check.outputs.code }}
@@TRIAGE_ENV@@        run: |
          # 0 is fine; empty means the step did not run. `factory check` returns 0, 1, 2 or 5 and every
          # non-zero code is a real error; if a step here ever runs a command that can return 6 (engine
          # busy), name it in this comment and accept 6 for that step only.
          for c in "${CHECK_CODE}" "${TRIAGE_CODE}"; do
            case "${c}" in ''|0) ;; *) exit "${c}" ;; esac
          done
