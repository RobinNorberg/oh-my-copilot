# omg-factory-heartbeat: generated by `omg factory setup --workflows` (oh-my-copilot @@VERSION@@).
# Mode: @@MODE@@. Re-run the command to re-render this file; it never overwrites a file it did not write without --force.
#
# Reads the backlog with `omg factory check --json` and prints the result in the log and as a pipeline artifact.
# It never starts factory lanes, calls Copilot, or uses a secret other than the job's System.AccessToken.
# The token is handed only to the steps that run omg. The install step has no token and skips install scripts.
@@MODE_NOTE@@# Triggers: schedule only (no CI or PR trigger), and only the default branch: Azure DevOps runs a schedule from the
# YAML of each listed branch, so any other branch would let whoever can push it run an edited copy with the token.
# Remove it: delete this file and the pipeline that points at it.
trigger: none
pr: none

schedules:
  - cron: '@@CRON@@'
    displayName: omg factory heartbeat
    branches:
      include:
        - '@@BRANCH@@'
    # always: true on purpose. This is a heartbeat: it must run on schedule even when the branch has no new commits.
    always: true

pool:
  vmImage: ubuntu-latest

variables:
  OMG_VERSION: '@@VERSION@@'

steps:
  - checkout: self

  - task: UseNode@1
    inputs:
      version: '22.x'

  - bash: npm install -g --ignore-scripts "oh-my-copilot@${OMG_VERSION}"
    displayName: Install omg (no token, no install scripts)

  - bash: |
      set +e
      mkdir -p heartbeat
      omg factory check --json > heartbeat/heartbeat-check.json
      code=$?
      head -c 20000 heartbeat/heartbeat-check.json
      echo
      # `factory check` returns 0, 1, 2 or 5; every non-zero code is a real error.
      exit "${code}"
    displayName: Factory check
    env:
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
@@TRIAGE_STEP@@
  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: heartbeat
      artifact: omg-factory-heartbeat
