# omg-factory-heartbeat: generated by `omg factory setup --workflows` (oh-my-copilot @@VERSION@@).
# Mode: @@MODE@@. Re-run the command to re-render this file; it never overwrites a file it did not write without --force.
#
# Reads the backlog with `omg factory check --json` and prints the result in the log and as a build artifact.
# It never starts factory lanes, calls Copilot, or uses a secret other than the job's System.AccessToken.
@@MODE_NOTE@@# Triggers: schedule only (no CI or PR trigger). Remove it: delete this file and the pipeline that points at it.
trigger: none
pr: none

schedules:
  - cron: '@@CRON@@'
    displayName: omg factory heartbeat
    branches:
      include:
        - '*'
    always: true

pool:
  vmImage: ubuntu-latest

variables:
  OMG_VERSION: '@@VERSION@@'

steps:
  - checkout: self
    persistCredentials: false

  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'

  - bash: |
      set +e
      npx --yes --package "oh-my-copilot@${OMG_VERSION}" omg factory check --json > heartbeat-check.json
      code=$?
      head -c 20000 heartbeat-check.json
      echo
      case "${code}" in 0|6) exit 0 ;; *) exit "${code}" ;; esac
    displayName: Factory check
    env:
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
@@TRIAGE_STEP@@
  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: heartbeat-check.json
      ArtifactName: omg-factory-heartbeat
