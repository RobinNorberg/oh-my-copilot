
  - bash: |
      set +e
      mkdir -p heartbeat
      omg factory triage --apply --json > heartbeat/heartbeat-triage.json
      code=$?
      head -c 20000 heartbeat/heartbeat-triage.json
      echo
      exit "${code}"
    displayName: Factory triage
    condition: succeededOrFailed()
    env:
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
