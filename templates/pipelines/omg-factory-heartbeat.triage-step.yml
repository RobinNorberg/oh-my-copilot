
  - bash: |
      set +e
      mkdir -p heartbeat
      omg factory triage --apply --json > heartbeat/heartbeat-triage.json 2> >(sed -u 's/##/#\\u0023/g' >&2)
      code=$?
      exit "${code}"
    displayName: Factory triage
    condition: succeededOrFailed()
    env:
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
